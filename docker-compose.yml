services:
  redis:
    image: redis:7-alpine
    command: ["redis-server","--appendonly","yes","--appendfsync","everysec"]
    restart: unless-stopped
    volumes:
      - kickbox-sync-redis:/data

  engine:
    build: ./engine
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - redis
    ports:
      - "127.0.0.1:8787:8787"

volumes:
  kickbox-sync-redis:
